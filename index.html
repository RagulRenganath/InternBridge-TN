                extend: {

                        brand: {
                            50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa',

    <style>
        body { background-color: theme('colors.bento.bg'); overflow: hidden; color: #1e293b; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .ambient-blob { position: absolute; border-radius: 50%; filter: blur(120px); z-index: -1; opacity: 0.5; pointer-events: none; }
        
        .bento-card {
            background: theme('colors.bento.card'); border-radius: 24px;
            border: 1px solid theme('colors.bento.border'); box-shadow: theme('boxShadow.bento');
            transition: all 0.3s ease; position: relative; overflow: hidden;
        }
        .bento-card:hover { transform: translateY(-4px); box-shadow: theme('boxShadow.bento-hover'); border-color: theme('colors.brand.300'); }

        .bento-glass {
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 1);
        }

        .animate-fade-in-up { animation: fadeInUp 0.5s ease-out forwards; }
        .stagger-1 { animation-delay: 0.05s; }
        .stagger-2 { animation-delay: 0.1s; }
        .stagger-3 { animation-delay: 0.15s; }
        .stagger-4 { animation-delay: 0.2s; }

        .framer-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .framer-btn:active { transform: scale(0.96); }

        .kanban-col { background: #f1f5f9; border-radius: 20px; border: 1px solid #e2e8f0; }
        
        .bar-fill { animation: fillUp 1s ease-out forwards; transform-origin: bottom; }
        @keyframes fillUp { 0% { transform: scaleY(0); } 100% { transform: scaleY(1); } }
        
        /* Mobile specific utilities */
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

                        UI.showToast(`Moved to interview! WhatsApp alert sent to ${c.name}.`, 'message-circle');

                const domainEl = document.getElementById('post-domain');
                const locEl = document.getElementById('post-location');
                const stipendEl = document.getElementById('post-stipend');
                const widgetEl = document.getElementById('benchmark-widget');

                if (!domainEl || !locEl || !stipendEl || !widgetEl) return;

                const domain = domainEl.value;
                const loc = locEl.value.split('/')[0].trim() || 'Coimbatore';
                const stipend = parseInt(stipendEl.value);

                if (isNaN(stipend) || stipend <= 0) {
                    widgetEl.classList.add('hidden');
                    return;
                }

                // Mock dynamic market averages
                let avg = 15000;
                if (domain === 'Finance') avg = 18000;
                if (domain === 'Technology') avg = 20000;
                if (domain === 'Economics') avg = 16000;
                if (domain === 'Operations') avg = 14000;

                let statusColor = 'text-amber-800 bg-amber-50 border-amber-200';
                let icon = 'alert-triangle';
                let iconColor = 'text-amber-500';
                let message = `The average stipend for a ${domain} Intern in ${loc} is currently ₹${avg.toLocaleString()}/mo. Your offer is below average, which may impact candidate flow.`;

                    statusColor = 'text-emerald-800 bg-emerald-50 border-emerald-200';
                    icon = 'trending-up';
                    iconColor = 'text-emerald-500';

                    icon = 'check-circle';
                    iconColor = 'text-blue-500';
                    message = `The average stipend for a ${domain} Intern in ${loc} is currently ₹${avg.toLocaleString()}/mo. Your offer is competitive.`;

                widgetEl.innerHTML = `

                        <p class="text-xs font-bold leading-relaxed">${message}</p>
                    </div>

                if (window.lucide) window.lucide.createIcons();

                                    <p class="text-[10px] md:text-xs font-bold text-slate-500 mb-6 md:mb-8">Standardized placement data matrix compliant with ${type} guidelines.</p>
                                    <button onclick="Actions.generateReport('${type}')" class="w-full bg-slate-900 text-white py-3 md:py-3.5 rounded-xl text-sm font-black hover:bg-blue-600 transition-colors shadow-md flex items-center justify-center gap-2 framer-btn">
                                        Generate <i data-lucide="download-cloud" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `
            }
        };

        window.onload = () => {
            UI.render();
        };
    </script>
</body>
</html>
